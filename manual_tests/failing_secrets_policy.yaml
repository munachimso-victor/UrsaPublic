Binding Policy:
apiVersion: control.kubestellar.io/v1alpha1
kind: BindingPolicy
metadata:
  name: ursa-ultimate-test-pod-policy-ursa-serviceaccount-template
spec:
  clusterSelectors:
  - matchLabels:
      name: edge-1
  - matchLabels:
      name: edge-2
  downsync:
  - objectNames:
    - ursa-bootstraptokensecret-template
    - ursa-dockerconfigjsonsecret-template
    - ursa-serviceaccounttokensecret-template
  - objectNames:
    - ursa-namespace-template
    statusCollectors:
    - namespace-details