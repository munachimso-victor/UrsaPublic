apiVersion: v1
kind: Namespace
metadata:
  name: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
---
apiVersion: v1
kind: Service
metadata:
  name: ursa-nodeport-localized-template
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/managed-by: ursa-testing
    ursa-workload: ultimate-test
  ports:
  - name: http-local
    protocol: TCP
    port: 80
    targetPort: 8080
