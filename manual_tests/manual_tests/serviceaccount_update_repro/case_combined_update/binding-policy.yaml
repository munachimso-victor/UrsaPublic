apiVersion: control.kubestellar.io/v1alpha1
kind: BindingPolicy
metadata:
  name: ursa-bp-sa-repro
spec:
  clusterSelectors:
    - matchLabels:
        name: edge-1
    - matchLabels:
        name: edge-2
  downsync:
