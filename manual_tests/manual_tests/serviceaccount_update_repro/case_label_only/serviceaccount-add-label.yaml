# Step 2: warm update — same ServiceAccount with one new metadata label only.
# Spec (secrets[]) is unchanged; this isolates metadata propagation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ursa-serviceaccount-template
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
    ursa.repro/update: label-only
secrets:
  - name: ursa-opaquesecret-template
