apiVersion: v1
kind: Namespace
metadata:
  name: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
---
# Hub desired replicas BELOW HPA min → edge HPA clamps up → work-agent reverts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ursa-deploy-low
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      ursa-app: low-test
  template:
    metadata:
      labels:
        ursa-app: low-test
    spec:
      containers:
      - name: web
        image: nginx:alpine
        resources:
          requests:
            cpu: 100m
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ursa-hpa-low
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ursa-deploy-low
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
