# Case 3: secret + namespace + Pod that consumes the secret via imagePullSecrets.
apiVersion: v1
kind: Namespace
metadata:
  name: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
    repro.kubestellar.io/case: dockerconfigjson-case3
---
apiVersion: v1
kind: Secret
metadata:
  name: ursa-dockerconfigjsonsecret-template
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
    repro.kubestellar.io/case: dockerconfigjson-case3
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"reg.example.com":{"auth":"YWRtaW46cGFzc3dvcmQ="}}}'
---
apiVersion: v1
kind: Pod
metadata:
  name: repro-pod-dockerconfigjson
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
    repro.kubestellar.io/case: dockerconfigjson-case3
spec:
  restartPolicy: Never
  imagePullSecrets:
  - name: ursa-dockerconfigjsonsecret-template
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    imagePullPolicy: IfNotPresent
