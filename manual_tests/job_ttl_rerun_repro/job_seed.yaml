apiVersion: v1
kind: Namespace
metadata:
  name: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
---
# Same Job shape as the selector-drift repro; this folder focuses only on
# observing repeated re-creation after TTL cleanup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ursa-configmap-template
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
data:
  custom_config: This is a template for a ConfigMap used in ursa testing.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ursa-job-template
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: ursa-testing
        ursa-workload: batch-migration
    spec:
      restartPolicy: Never
      containers:
      - name: data-processor
        image: busybox
        command:
        - sh
        - -c
        - |
          echo "Job started"
          sleep 10
          echo "Job complete"
