apiVersion: v1
kind: Namespace
metadata:
  name: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
---
# From our automated test generation (ursa-bp-clusterip-auto seed): pins nothing,
# so none of the built-in Service transform strips apply to what we test here.
apiVersion: v1
kind: Service
metadata:
  name: ursa-clusterip-auto-template
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/managed-by: ursa-testing
    ursa-workload: ultimate-test
  ports:
  - name: http-internal
    protocol: TCP
    port: 80
    targetPort: 8080
---
# ExternalName variant for the headline drift example (spec.externalName).
apiVersion: v1
kind: Service
metadata:
  name: ursa-externalname-template
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
spec:
  type: ExternalName
  externalName: backend.example.com
---
# Deployment for the per-kind contrast: the SAME edge drift on a Deployment IS reverted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ursa-deployment-template
  namespace: ursa-namespace-template
  labels:
    app.kubernetes.io/managed-by: ursa-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      ursa-workload: drift-contrast
  template:
    metadata:
      labels:
        ursa-workload: drift-contrast
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.1
        ports:
        - containerPort: 8080
